name: Dependabot auto-merge

on: pull_request

# Dependabot-triggered workflows get a read-only token by default; these
# explicit permissions are what allow the job to enable auto-merge.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Does not merge immediately: GitHub merges the PR only once the required
      # status checks pass. If CI fails the PR just stays open.
      - name: Enable auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          # Not GITHUB_TOKEN: a merge made with it fires no workflows, so the
          # push to main would never rebuild the image. Dependabot runs only
          # see Dependabot secrets, so this one must be stored there.
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
