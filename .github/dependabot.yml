version: 2

updates:
  - package-ecosystem: "docker"
    directories:
      - "/build/claude"
      - "/build/codex"
      - "/build/doctl"
      - "/build/firebase"
      - "/build/flutter"
      - "/build/gcloud"
      - "/build/gemini"
      - "/build/gh"
      - "/build/opencode"
      - "/build/yt-dlp"
    schedule:
      interval: "daily"

    open-pull-requests-limit: 20

    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  
  - package-ecosystem: "gomod"
    directory: "/build/gh"
    schedule:
      interval: "daily"
    # Only gh itself, which go.mod marks "// indirect" because it's only a tool
    allow:
      - dependency-name: "github.com/cli/cli/v2"
        dependency-type: "all"
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "npm"
    directories:
      - "/build/claude"
      - "/build/codex"
      - "/build/doctl"
      - "/build/firebase"
      - "/build/gcloud"
      - "/build/gemini"
      - "/build/opencode"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "npm"